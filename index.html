<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050811" />
    <meta name="description" content="WEB-D Agency designs and develops distinctive, high-performance websites with fluid glass aesthetics for ambitious businesses around the world." />
    <meta property="og:title" content="WEB-D Agency — Built for your next chapter" />
    <meta property="og:description" content="Premium website design, motion graphics, and development for ambitious businesses worldwide." />
    <meta property="og:type" content="website" />
    <title>WEB-D Agency — Websites That Grow Your Business</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webd-theme');
          var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light-theme');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f7fc');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark-theme');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
